# Alembic configuration for homelab-helper.
#
# Developer convenience for driving the ``alembic`` CLI directly. The
# application itself never reads this file: ``helper db ...`` builds its
# config in code (src/homelab_helper/db/migrate.py) so an installed wheel
# works without a checkout. The connection URL is set at runtime by env.py
# from HOMELAB_HELPER_DATABASE_URL, with a SQLite fallback for local dev.

[alembic]
script_location = src/homelab_helper/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

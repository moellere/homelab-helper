# Workload profile starter library (Phase 5, AC1).
#
# Baselines are *starter estimates* for a small homelab deployment — enough to
# reason about placement, not benchmarks. Operators override by copying an
# entry into their own library file and editing; community contributions
# adjust these in place.
#
# Fields per entry:
#   category      media | automation | network | files | monitoring | nvr |
#                 dev | database | downloads | misc
#   cpu_cores     baseline sustained cores (float; bursts excluded)
#   ram_mb        baseline resident memory
#   storage_gb    app + config footprint (NOT the data it manages — see
#                 data_gravity for that)
#   scaling       flat | with-users | with-data | with-cameras | with-devices
#   arch          supported CPU architectures
#   gpu           none | optional | required
#   gpu_purpose   what the GPU buys (only when gpu != none)
#   depends_on    other workloads it needs running
#   data_gravity  the large dataset it wants to live near (null if none)
#   artifacts     common deployment forms


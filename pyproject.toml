[project]
name = "homelab-helper"
version = "0.1.0.dev0"
description = "OSS framework for homelab planning, inventory, audit, and (eventually) recommendations."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Enoch", email = "enoch@tweektech.com" }]
requires-python = ">=3.12"
keywords = ["homelab", "inventory", "netbox", "proxmox", "kubernetes", "audit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10.4",
    "asyncssh>=2.14.2",
    "uuid6>=2024.7.10",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]

[project.scripts]
helper = "homelab_helper.cli.main:app"

[project.entry-points."homelab_helper.probes"]
# First-party probes ship via the same entry-point mechanism third-party
# plugins use — no internal/external distinction.
"host.identity" = "homelab_helper.probes.host.identity:HostIdentityProbe"
"host.cpu"      = "homelab_helper.probes.host.cpu:HostCpuProbe"
"host.memory"   = "homelab_helper.probes.host.memory:HostMemoryProbe"
"host.network"  = "homelab_helper.probes.host.network:HostNetworkProbe"
"host.storage"  = "homelab_helper.probes.host.storage:HostStorageProbe"
"host.services" = "homelab_helper.probes.host.services:HostServicesProbe"
"host.smart"    = "homelab_helper.probes.host.smart:HostSmartProbe"
"talos.host"    = "homelab_helper.probes.talos.host:TalosHostProbe"
"network.subnet-scan" = "homelab_helper.probes.network.subnet_scan:NetworkSubnetScanProbe"
"network.fingerprint" = "homelab_helper.probes.network.fingerprint:NetworkFingerprintProbe"

[project.urls]
Homepage = "https://github.com/enochroot/homelab-helper"
Repository = "https://github.com/enochroot/homelab-helper"
Issues = "https://github.com/enochroot/homelab-helper/issues"

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.1",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_helper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM",
    "TCH", "TID", "PL", "PT", "ASYNC",
]
ignore = [
    "E501",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",
    "PLC0415",
    "RUF100",
]
# SQLAlchemy 2.0 Mapped[...] needs uuid/datetime resolvable at runtime,
# not just TYPE_CHECKING. Disable the type-checking-block movers for models.
"src/homelab_helper/db/models/*" = ["TC001", "TC002", "TC003"]
# kernel_ssh exposes timeout= as ergonomic config, not a structured-concurrency
# escape hatch. Suppress ASYNC109 here.
"src/homelab_helper/adapters/kernel_ssh.py" = ["ASYNC109"]
# Same rationale for the talos adapter: timeout= is per-call config passed
# through to the talosctl subprocess wrapper.
"src/homelab_helper/adapters/talos.py" = ["ASYNC109"]
# Typer commands legitimately call typer.Option/typer.Argument in defaults (B008)
# and need Path at runtime for parameter resolution (TC003). Command handlers
# also inline arg validation + an async _go() + reporting, so they run long
# (PLR0915) without being genuinely complex.
"src/homelab_helper/cli/*" = ["B008", "TC003", "PLR0915"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["apscheduler.*", "uuid6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:sqlalchemy.*",
]

[tool.coverage.run]
source = ["src/homelab_helper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

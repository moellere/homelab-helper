# End of free security support per operating-system release (Phase 8.1).
#
# These dates are data, not opinion: the version-currency pass compares a host's
# release against this table and nothing else. Correct a date here, not in code.
# "eol" is the last day the release receives free security updates — Debian LTS
# end for Debian and its derivatives, end of standard support for Ubuntu.
# Paid extensions (Debian ELTS, Ubuntu Pro/ESM) are deliberately not counted.

aliases:
  raspbian: debian

debian:
  "10": {codename: buster, eol: 2024-06-30, basis: "Debian LTS end"}
  "11": {codename: bullseye, eol: 2026-08-31, basis: "Debian LTS end"}
  "12": {codename: bookworm, eol: 2028-06-30, basis: "Debian LTS end"}
  "13": {codename: trixie, eol: 2030-06-30, basis: "Debian LTS end"}

ubuntu:
  "20.04": {codename: focal, eol: 2025-05-31, basis: "end of standard support"}
  "22.04": {codename: jammy, eol: 2027-04-30, basis: "end of standard support"}
  "24.04": {codename: noble, eol: 2029-04-30, basis: "end of standard support"}
  "25.04": {codename: plucky, eol: 2026-01-31, basis: "end of standard support"}
  "25.10": {codename: questing, eol: 2026-07-31, basis: "end of standard support"}
  "26.04": {codename: resolute, eol: 2031-04-30, basis: "end of standard support"}

# Ceph releases, by major version (upstream "estimated end-of-life" from
# docs.ceph.com/en/latest/releases/). Proxmox tracks upstream here.
ceph:
  "18": {codename: reef, eol: 2026-03-20, basis: "upstream end of life"}
  "19": {codename: squid, eol: 2026-10-31, basis: "upstream end of life"}
  "20": {codename: tentacle, eol: 2027-06-01, basis: "upstream end of life"}

# Kubernetes minors: upstream end of patch support (endoflife.date, ~14 months
# after release). Judged on the kubelet version the nodes report.
kubernetes:
  "1.33": {eol: 2026-06-28, basis: "upstream end of patch support"}
  "1.34": {eol: 2026-10-27, basis: "upstream end of patch support"}
  "1.35": {eol: 2027-02-28, basis: "upstream end of patch support"}
  "1.36": {eol: 2027-06-28, basis: "upstream end of patch support"}
  "1.37": {eol: 2027-10-28, basis: "upstream end of patch support"}

# Talos Linux: Sidero supports the latest two minors, so a minor's support ends
# the day the second minor after it ships. Only superseded minors carry a date;
# a current minor has no entry until its successor's successor is released.
talos:
  "1.11": {eol: 2026-04-27, basis: "two newer minors released (v1.13.0)"}
  "1.12": {eol: 2026-09-03, basis: "two newer minors released (v1.14.0)"}
